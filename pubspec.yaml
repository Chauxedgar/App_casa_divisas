name: casa_divisas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  #Paquetes de Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.1
  cloud_firestore: 5.5.0
  
  # Paquetes y herramientas de la app
  webview_flutter: ^4.7.0
  url_launcher: ^6.2.5
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Declaración correcta de los activos (assets) para el archivo .env
  assets:
    - .env